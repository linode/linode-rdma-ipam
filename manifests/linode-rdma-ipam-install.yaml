apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linode-rdma-ipam-install
  namespace: nvidia-network-operator
  labels:
    app: linode-rdma-ipam-install
spec:
  selector:
    matchLabels:
      app: linode-rdma-ipam-install
  template:
    metadata:
      labels:
        app: linode-rdma-ipam-install
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-15b3.present: "true"
      initContainers:
      - name: install-cni-bin
        image: linode-rdma-ipam:latest
        imagePullPolicy: IfNotPresent
        command: ["cp", "/linode-rdma-ipam", "/host/opt/cni/bin/linode-rdma-ipam"]
        volumeMounts:
        - name: cnibin
          mountPath: /host/opt/cni/bin
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          limits:
            memory: 16Mi
      volumes:
      - name: cnibin
        hostPath:
          path: /opt/cni/bin
          type: Directory
